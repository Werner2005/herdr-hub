apiVersion: v1
kind: Pod
metadata:
  name: {{ include "herdr-hub.fullname" . }}-api-test
  labels:
    herdr-hub/api-test: {{ include "herdr-hub.fullname" . | quote }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: api-test
      image: curlimages/curl:8.12.1
      env:
        - name: HUB_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.hub.existingSecret }}
              key: {{ .Values.hub.tokenKey }}
        - name: HUB_URL
          value: "http://{{ include "herdr-hub.fullname" . }}:{{ .Values.service.port }}"
      command: ["sh", "-ec"]
      args:
        - |
          curl --fail --silent --show-error "$HUB_URL/healthz"
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' "$HUB_URL/api/workspaces")
          test "$code" = 401
          curl --fail --silent --show-error --output /dev/null \
            -H "Authorization: Bearer $HUB_API_TOKEN" "$HUB_URL/api/config"
          curl --fail --silent --show-error --output /dev/null \
            -H "Authorization: Bearer $HUB_API_TOKEN" "$HUB_URL/api/workspaces"
          printf '\nHub health, authentication, and workspace API passed.\n'
