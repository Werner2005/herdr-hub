{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "herdr-hub.fullname" . }}
  labels:
    {{- include "herdr-hub.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "Set gateway.name to the existing Gateway name" .Values.gateway.name }}
      {{- with .Values.gateway.namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- with .Values.gateway.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  hostnames:
    {{- if .Values.gateway.hostname }}
    - {{ .Values.gateway.hostname | lower | quote }}
    {{- else }}
    - {{ printf "%s.%s" (required "Set subdomain when Gateway API is enabled" .Values.subdomain) (required "Set gateway.domain when Gateway API is enabled" .Values.gateway.domain) | lower | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "herdr-hub.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
